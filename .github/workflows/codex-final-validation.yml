name: Validate Codex workspace

on:
  push:
    branches:
      - codex-fast-ultra-pi-ui
    paths:
      - .github/workflows/codex-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'chore: validate Codex workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex-fast-ultra-pi-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Full validation
        shell: bash
        run: |
          test -f apps/web/package.json
          test -f apps/server/package.json
          corepack enable
          set +e
          {
            pnpm install --frozen-lockfile &&
            pnpm format:check &&
            pnpm lint &&
            pnpm typecheck &&
            pnpm test &&
            pnpm build &&
            pnpm perf:check &&
            pnpm test:smoke
          } 2>&1 | tee /tmp/final-validation.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            cp /tmp/final-validation.log .validation-failure.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .validation-failure.log
            git commit -m "chore: capture validation diagnostics" || true
            git push origin HEAD:codex-fast-ultra-pi-ui
            exit $status
          fi
      - name: Remove bootstrap files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .rebuild-failure.log .validation-failure.log scripts/rebuild-codex-workspace.sh
          rm -f .github/workflows/workspace-snapshot.yml
          rm -f .github/workflows/codex-rebuild.yml
          rm -f .github/workflows/codex-rebuild-diagnostics.yml
          rm -f .github/workflows/codex-rebuild-fix.yml
          rm -f .github/workflows/codex-final-validation.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize Codex workspace"
            git push origin HEAD:codex-fast-ultra-pi-ui
          fi
