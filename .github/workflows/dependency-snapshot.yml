name: Dependency snapshot

on:
  push:
    branches:
      - codex-fast-ultra-pi-ui
    paths:
      - .github/workflows/dependency-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies without a shared cache
        run: pnpm install --force
      - name: Archive workspace dependencies
        run: |
          tar -czf dependency-snapshot.tar.gz \
            node_modules \
            packages/*/node_modules \
            site/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node24-dependencies-${{ github.sha }}
          path: dependency-snapshot.tar.gz
          compression-level: 0
          retention-days: 1
