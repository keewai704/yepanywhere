name: Workspace snapshot

on:
  push:
    branches:
      - codex-fast-ultra-pi-ui
    paths:
      - .github/workflows/workspace-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create source archive
        run: tar --exclude=.git -czf yepanywhere-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: yepanywhere-source-${{ github.sha }}
          path: yepanywhere-source.tar.gz
          compression-level: 0
          retention-days: 1
