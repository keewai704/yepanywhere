name: Workspace snapshot

on:
  push:
    branches:
      - codex-fast-ultra-pi-ui
    paths:
      - .github/workflows/workspace-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: yepanywhere

      - name: Check out visual reference
        uses: actions/checkout@v5
        with:
          repository: agegr/pi-web
          ref: main
          path: pi-web

      - name: Create source archives
        run: |
          tar --exclude=.git -C yepanywhere -czf yepanywhere-source.tar.gz .
          tar --exclude=.git -C pi-web -czf pi-web-source.tar.gz .

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: workspace-sources-${{ github.sha }}
          path: |
            yepanywhere-source.tar.gz
            pi-web-source.tar.gz
          compression-level: 0
          retention-days: 1
